<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Summoner Wars — game replay</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1c1916;
    --ink: #efe7dc;
    --muted: #9c9186;
    --a: #4f9dd4;
    --b: #d4734f;
    --board: #2a241f;
    --line: #3a322b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 16px; align-items: baseline;
    padding: 14px 20px; border-bottom: 1px solid var(--line);
  }
  h1 { font-size: 16px; margin: 0; letter-spacing: .04em; text-transform: uppercase; }
  .meta { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(320px, 520px) 1fr; gap: 20px; padding: 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }

  .board {
    display: grid; grid-template-columns: repeat(6, 1fr); grid-template-rows: repeat(8, 1fr);
    gap: 4px; aspect-ratio: 6 / 8; background: var(--board);
    padding: 8px; border-radius: 10px; border: 1px solid var(--line);
  }
  .cell {
    position: relative; border-radius: 6px; background: #221d19;
    border: 1px solid #332c26; min-height: 34px; overflow: hidden;
  }
  .cell.side-a { background: #1d232a; border-color: #2b3946; }
  .cell.side-b { background: #2a221d; border-color: #46352b; }
  .unit {
    position: absolute; inset: 2px; border-radius: 5px; padding: 2px 3px;
    display: flex; flex-direction: column; justify-content: space-between;
    font-size: 10px; line-height: 1.1; cursor: pointer; overflow: hidden;
  }
  .unit.a { background: #234a63; border: 1px solid #4f9dd4; color: #e8f4ff; }
  .unit.b { background: #63372a; border: 1px solid #d4734f; color: #ffece4; }
  .unit.summoner { box-shadow: 0 0 0 2px #d9c37a inset; }
  .unit.gate { background: #2f2a22; border: 1px dashed #8b7a5c; color: #cbbf9f; }
  .unit .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .unit .stats { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
  .unit .dmg { color: #ffb3a7; }

  .panel { display: grid; gap: 14px; align-content: start; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .card h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .turnbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .pill { border: 1px solid var(--line); border-radius: 999px; padding: 3px 10px; font-size: 12px; }
  .pill.a { border-color: var(--a); color: #cfe8fb; }
  .pill.b { border-color: var(--b); color: #ffe1d6; }
  .label { font-size: 15px; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    background: #2a2420; color: var(--ink); border: 1px solid var(--line);
    padding: 7px 12px; border-radius: 8px; cursor: pointer; font: inherit;
  }
  button:hover { background: #342c26; }
  button:disabled { opacity: .45; cursor: default; }
  input[type=range] { flex: 1; min-width: 160px; accent-color: #d9c37a; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td, th { text-align: left; padding: 3px 0; vertical-align: top; }
  th { color: var(--muted); font-weight: 500; }
  .zone { color: var(--muted); font-size: 12px; }
  .hand span { display: inline-block; background: #262019; border: 1px solid var(--line);
    border-radius: 6px; padding: 2px 7px; margin: 2px 4px 2px 0; font-size: 12px; }
  .empty { color: var(--muted); font-style: italic; }
</style>
</head>
<body>
<header>
  <h1>Summoner Wars — replay</h1>
  <div class="meta" id="meta"></div>
</header>

<main>
  <section>
    <div class="board" id="board"></div>
    <div class="zone" style="margin-top:8px">
      Player A sits at the bottom, player B at the top. Numbers: life left and strength.
    </div>
  </section>

  <section class="panel">
    <div class="card">
      <div class="turnbar">
        <span class="pill" id="turn">turn</span>
        <span class="pill" id="phase">phase</span>
        <span class="pill" id="active">active</span>
      </div>
      <p class="label" id="action" style="margin:10px 0 0"></p>
    </div>

    <div class="card">
      <div class="controls">
        <button id="first" title="First frame">⏮</button>
        <button id="prev" title="Previous">◀</button>
        <button id="play" title="Play / pause">▶ play</button>
        <button id="next" title="Next">▶</button>
        <button id="last" title="Last frame">⏭</button>
        <input type="range" id="slider" min="0" value="0">
        <span class="zone" id="counter"></span>
      </div>
      <div class="controls" style="margin-top:8px">
        <label class="zone">speed
          <select id="speed">
            <option value="700">slow</option>
            <option value="280" selected>normal</option>
            <option value="90">fast</option>
          </select>
        </label>
      </div>
    </div>

    <div class="card">
      <h2>Players</h2>
      <table id="players"></table>
    </div>

    <div class="card">
      <h2>Details</h2>
      <div id="details" class="zone">Click a unit on the board.</div>
    </div>
  </section>
</main>

<script id="replay-data" type="application/json">__REPLAY_DATA__</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("replay-data").textContent);
  var frames = DATA.frames;
  var index = 0;
  var timer = null;

  var board = document.getElementById("board");
  var slider = document.getElementById("slider");
  var meta = document.getElementById("meta");

  meta.textContent =
    DATA.meta.deck_a + " (A) vs " + DATA.meta.deck_b + " (B) · seed " + DATA.meta.seed +
    " · " + frames.length + " frames · result: " + (DATA.meta.result || "unfinished");

  slider.max = String(frames.length - 1);

  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderBoard(state) {
    board.textContent = "";
    var bySquare = {};
    state.units.forEach(function (unit) {
      bySquare[unit.x + "," + unit.y] = unit;
    });

    for (var row = 0; row < 8; row++) {
      for (var col = 0; col < 6; col++) {
        var y = 7 - row;              // player A (rows 0-3) ends up at the bottom
        var cell = el("div", "cell side-" + (y < 4 ? "a" : "b"));
        var unit = bySquare[col + "," + y];
        if (unit) cell.appendChild(renderUnit(unit));
        board.appendChild(cell);
      }
    }
  }

  function renderUnit(unit) {
    var classes = "unit " + (unit.owner === 0 ? "a" : "b");
    if (unit.kind === "SUMMONER") classes += " summoner";
    if (unit.kind === "GATE" || unit.kind === "STRUCTURE") classes += " gate";
    var node = el("div", classes);

    var name = unit.name + (unit.boosts ? " +" + unit.boosts : "");
    node.appendChild(el("div", "name", name));

    var stats = el("div", "stats");
    var life = el("span", "dmg", unit.life - unit.damage + "/" + unit.life);
    var strength = el("span", null, unit.kind === "GATE" ? "gate" : String(unit.strength + unit.boosts));
    stats.appendChild(life);
    stats.appendChild(strength);
    node.appendChild(stats);

    node.addEventListener("click", function () { showDetails(unit); });
    return node;
  }

  function showDetails(unit) {
    var rows = [
      ["card", unit.name],
      ["class", unit.card_class],
      ["kind", unit.kind],
      ["owner", unit.owner === 0 ? "A" : "B"],
      ["square", unit.position],
      ["life", (unit.life - unit.damage) + " of " + unit.life],
      ["attack", unit.attack],
      ["strength", String(unit.strength) + (unit.boosts ? " (+" + unit.boosts + " boost)" : "")],
      ["card id", unit.card]
    ];
    var html = "<table>";
    rows.forEach(function (row) {
      html += "<tr><th>" + row[0] + "</th><td>" + row[1] + "</td></tr>";
    });
    html += "</table>";
    document.getElementById("details").innerHTML = html;
  }

  function renderPlayers(state) {
    var table = document.getElementById("players");
    table.textContent = "";
    var head = document.createElement("tr");
    ["", "A", "B"].forEach(function (text) { head.appendChild(el("th", null, text)); });
    table.appendChild(head);

    function row(title, values) {
      var tr = document.createElement("tr");
      tr.appendChild(el("th", null, title));
      values.forEach(function (value) { tr.appendChild(el("td", null, value)); });
      table.appendChild(tr);
    }

    var a = state.players[0], b = state.players[1];
    row("magic", [a.magic, b.magic]);
    row("summoner life", [a.summoner_life, b.summoner_life]);
    row("deck", [a.deck, b.deck]);
    row("discard", [a.discard, b.discard]);
    row("active events", [a.active_events.join(", ") || "—", b.active_events.join(", ") || "—"]);

    [a, b].forEach(function (seat, i) {
      var tr = document.createElement("tr");
      tr.appendChild(el("th", null, "hand"));
      var td = document.createElement("td");
      td.colSpan = 2;
      var wrap = el("div", "hand");
      if (!seat.hand.length) {
        wrap.appendChild(el("span", "empty", "empty"));
      } else {
        seat.hand.forEach(function (name) { wrap.appendChild(el("span", null, name)); });
      }
      td.appendChild(wrap);
      tr.appendChild(td);
      table.appendChild(tr);
    });
  }

  function render() {
    var frame = frames[index];
    var state = frame.state;

    renderBoard(state);
    renderPlayers(state);

    document.getElementById("turn").textContent = "turn " + state.turn;
    document.getElementById("phase").textContent = state.phase.toLowerCase();
    var activePill = document.getElementById("active");
    activePill.textContent = "active: " + (state.active === 0 ? "A" : "B");
    activePill.className = "pill " + (state.active === 0 ? "a" : "b");

    var action = document.getElementById("action");
    action.textContent = frame.label + (frame.result ? " — " + frame.result : "");

    slider.value = String(index);
    document.getElementById("counter").textContent = (index + 1) + " / " + frames.length;
    document.getElementById("prev").disabled = index === 0;
    document.getElementById("first").disabled = index === 0;
    document.getElementById("next").disabled = index === frames.length - 1;
    document.getElementById("last").disabled = index === frames.length - 1;
  }

  function go(delta) {
    index = Math.min(frames.length - 1, Math.max(0, index + delta));
    render();
  }

  function stop() {
    if (timer) { clearInterval(timer); timer = null; }
    document.getElementById("play").textContent = "▶ play";
  }

  function play() {
    if (timer) { stop(); return; }
    document.getElementById("play").textContent = "❚❚ pause";
    var delay = parseInt(document.getElementById("speed").value, 10);
    timer = setInterval(function () {
      if (index >= frames.length - 1) { stop(); return; }
      go(1);
    }, delay);
  }

  document.getElementById("first").addEventListener("click", function () { stop(); index = 0; render(); });
  document.getElementById("last").addEventListener("click", function () { stop(); index = frames.length - 1; render(); });
  document.getElementById("prev").addEventListener("click", function () { stop(); go(-1); });
  document.getElementById("next").addEventListener("click", function () { stop(); go(1); });
  document.getElementById("play").addEventListener("click", play);
  slider.addEventListener("input", function () { stop(); index = parseInt(slider.value, 10); render(); });

  document.addEventListener("keydown", function (event) {
    if (event.key === "ArrowLeft") { stop(); go(-1); }
    if (event.key === "ArrowRight") { stop(); go(1); }
    if (event.key === " ") { event.preventDefault(); play(); }
  });

  render();
})();
</script>
</body>
</html>
