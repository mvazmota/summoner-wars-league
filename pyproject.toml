[project]
name = "summoner-wars-league"
version = "0.1.0"
description = "Local simulator and 20-agent league for Summoner Wars (Second Edition)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sw_engine", "src/sw_cards"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "hypothesis>=6.112",
    "mypy>=1.11",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "RUF", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["sw_engine", "sw_cards", "agents", "league"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
mypy_path = "src"
warn_unreachable = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: long-running fuzz and league tests (deselected with -m 'not slow')",
]
